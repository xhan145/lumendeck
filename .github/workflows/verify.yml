name: Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Repeated PR pushes should not compile the same Windows toolchain in parallel.
# Keep manual workflow_dispatch runs intact for explicit verification.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend build
        run: npm run build

      - name: Set up Python 3.12 for bridge discovery tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bridge Python discovery unit tests
        run: python bridge/test_python_discovery.py

      - name: Rust check (development config without packaged sidecar)
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust filesystem unit tests (real temp directories, no-clobber rename)
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
