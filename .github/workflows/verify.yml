name: Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend build
        run: npm run build

      - name: Rust check (development config without packaged sidecar)
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust filesystem unit tests (real temp directories, no-clobber rename)
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
